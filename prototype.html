<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <title>邻里照护 · 闭环流程演示</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202c28;
      --muted: #63716a;
      --line: #e0e6e1;
      --paper: #f5f7f3;
      --surface: #fff;
      --green: #17664f;
      --green-soft: #e6f1eb;
      --orange: #bc593f;
      --orange-soft: #fff0e9;
      --amber: #895d20;
      --amber-soft: #fff4dd;
      --red: #a84037;
      --red-soft: #fbecea;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:17px max(22px,calc((100vw - 1180px)/2)); background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; }
    .mark { display:grid; place-items:center; width:31px; height:31px; border-radius:9px; color:#fff; background:var(--green); }
    .demo-label { padding:6px 10px; border-radius:7px; color:#725421; background:var(--amber-soft); font-size:12px; }
    main { width:min(1180px,calc(100% - 36px)); margin:28px auto 56px; }
    .heading { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:22px; }
    h1 { margin:0; font-size:27px; line-height:1.25; }
    .heading p { margin:7px 0 0; color:var(--muted); }
    .role-switch { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .role-switch button { min-height:40px; padding:0 14px; border:0; border-radius:7px; color:var(--muted); background:transparent; }
    .role-switch button[aria-pressed="true"] { color:#fff; background:var(--green); }
    .layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(290px,.8fr); gap:18px; align-items:start; }
    .panel { border:1px solid var(--line); border-radius:12px; background:var(--surface); }
    .main-panel { min-height:570px; padding:24px; }
    .side-panel { padding:21px; }
    .panel-head { display:flex; justify-content:space-between; align-items:start; gap:15px; padding-bottom:16px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--muted); font-size:12px; }
    h2 { margin:3px 0 0; font-size:20px; }
    h3 { margin:0; font-size:15px; }
    .status { padding:6px 9px; border-radius:6px; color:#235c47; background:var(--green-soft); white-space:nowrap; font-size:12px; }
    .status.warn { color:var(--amber); background:var(--amber-soft); }
    .status.issue { color:var(--red); background:var(--red-soft); }
    .facts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 26px; padding:9px 0 16px; }
    .fact { padding:12px 0; border-bottom:1px solid #edf0ed; }
    .fact span { display:block; margin-bottom:4px; color:var(--muted); font-size:12px; }
    .fact strong { font-size:14px; font-weight:600; }
    .notice { margin:4px 0 18px; padding:12px 13px; border-radius:8px; color:#70552a; background:#fff6e6; font-size:12px; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; padding-top:16px; }
    .btn { min-height:44px; padding:0 15px; border:1px solid #ccd6cf; border-radius:8px; color:#34443d; background:#fff; }
    .btn.primary { border-color:var(--green); color:#fff; background:var(--green); }
    .btn.danger { border-color:#e9c9c5; color:var(--red); background:#fff; }
    .btn:hover { filter:brightness(.97); }
    .btn:focus-visible, .role-switch button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #93c4ad; outline-offset:2px; }
    .step-list { display:grid; grid-template-columns:repeat(5,1fr); margin:19px 0 4px; }
    .step { position:relative; color:#808b85; text-align:center; font-size:11px; }
    .step:not(:last-child):after { content:""; position:absolute; z-index:0; top:10px; left:60%; right:-40%; height:1px; background:#dce3dd; }
    .step i { position:relative; z-index:1; display:grid; place-items:center; width:21px; height:21px; margin:0 auto 6px; border:1px solid #cfd8d1; border-radius:50%; color:#64736a; background:#fff; font-style:normal; font-size:10px; }
    .step.done { color:#245b46; }
    .step.done i { border-color:var(--green); color:#fff; background:var(--green); }
    .timeline { display:flex; flex-direction:column; gap:0; margin-top:16px; }
    .event { display:grid; grid-template-columns:20px 1fr; gap:10px; padding:0 0 16px; }
    .event-mark { position:relative; display:flex; justify-content:center; }
    .event-mark:before { content:""; width:9px; height:9px; margin-top:5px; border:2px solid #76a38c; border-radius:50%; background:#fff; }
    .event:not(:last-child) .event-mark:after { content:""; position:absolute; top:17px; bottom:-1px; width:1px; background:#dfe7e1; }
    .event strong { display:block; font-size:12px; font-weight:600; }
    .event time { display:block; margin-top:3px; color:#7d8983; font-size:11px; }
    .empty { padding:34px 14px; text-align:center; color:var(--muted); }
    .form { display:grid; gap:14px; padding-top:19px; max-width:620px; }
    .field label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; }
    .field small { color:var(--muted); font-weight:400; }
    .field select,.field input,.field textarea { width:100%; min-height:44px; padding:10px 11px; border:1px solid #d5ded7; border-radius:8px; color:var(--ink); background:#fff; }
    .field textarea { min-height:74px; resize:vertical; }
    .summary-row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #edf0ed; font-size:13px; }
    .summary-row span { color:var(--muted); }
    .response { margin:17px 0; padding:15px; border:1px solid var(--line); border-radius:9px; }
    .response-top { display:flex; justify-content:space-between; gap:12px; }
    .response p { margin:9px 0; color:var(--muted); font-size:12px; }
    .response strong { font-size:14px; }
    .quiet { color:var(--muted); font-size:12px; }
    .footnote { margin-top:16px; color:#77837d; font-size:11px; }
    .reset { padding:8px 10px; border:0; border-radius:7px; color:#5b6961; background:#edf1ed; font-size:12px; }
    .modal-backdrop { position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:18px; background:rgba(18,31,25,.34); }
    .modal { width:min(450px,100%); padding:22px; border-radius:12px; background:#fff; box-shadow:0 18px 55px rgba(0,0,0,.18); }
    .modal h2 { margin:0 0 7px; font-size:19px; }
    .modal p { color:var(--muted); font-size:13px; }
    @media (max-width:760px) {
      .topbar { align-items:flex-start; flex-direction:column; }
      main { width:calc(100% - 24px); margin-top:21px; }
      .heading { align-items:flex-start; flex-direction:column; }
      h1 { font-size:23px; }
      .role-switch { width:100%; }
      .role-switch button { flex:1; padding:0 8px; }
      .layout { grid-template-columns:1fr; }
      .main-panel,.side-panel { padding:18px; }
      .facts { gap:0 14px; }
      .step-list { margin-left:-4px; margin-right:-4px; }
      .step { font-size:9px; }
    }
    @media (max-width:390px) {
      .step-list { grid-template-columns:repeat(5,minmax(48px,1fr)); overflow:auto; }
      .step { min-width:48px; }
      .facts { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">邻</span><span>邻里照护</span><span class="demo-label">全流程模拟演示 · 不产生真实订单</span></div>
    <button class="reset" id="reset">重置演示</button>
  </header>
  <main>
    <div class="heading">
      <div><h1>供需撮合与履约闭环</h1><p>一条演示需求，从发布、响应、预约到完成/评价或投诉的全流程。</p></div>
      <div class="role-switch" role="group" aria-label="切换演示角色">
        <button data-role="consumer" aria-pressed="true">家属端</button>
        <button data-role="provider" aria-pressed="false">服务方端</button>
        <button data-role="ops" aria-pressed="false">运营端</button>
      </div>
    </div>
    <div class="layout">
      <section class="panel main-panel" id="main" aria-live="polite"></section>
      <aside class="panel side-panel">
        <h3>订单事件时间线</h3>
        <p class="quiet">每次状态变化都会留下操作者和时间。演示数据仅保存在当前页面内存中。</p>
        <div class="timeline" id="timeline"></div>
      </aside>
    </div>
  </main>
  <div id="modal-root"></div>
  <script>
    const steps = ["发布需求", "服务方响应", "预约确认", "服务履约", "完成评价"];
    const labels = {
      draft: ["未提交", 0], open: ["待服务方响应", 1], responded: ["收到服务响应", 1],
      selected: ["待家属确认服务单", 2], booking_proposed: ["待服务方确认预约", 2],
      booked: ["预约已确认", 3], in_service: ["服务进行中", 3],
      completion_pending: ["待家属确认完成", 4], completed: ["已完成", 5],
      cancel_requested: ["取消申请处理中", 3], cancelled: ["已取消", 5],
      reschedule_requested: ["改期申请处理中", 3],
      complaint: ["投诉处理中", 5], resolution_proposed: ["待确认处理结果", 5],
      resolved: ["投诉已关闭", 5], reopened: ["申请复核中", 5]
    };
    const initial = () => ({
      role: "consumer", status: "draft", demandId: "演示需求 #D-2048",
      category: "陪诊就医", region: "杭州 · 拱墅区", date: "2026-11-03 上午",
      mobility: "需搀扶", note: "协助完成挂号、候诊和院内路线指引",
      provider: "安心陪诊 · 拱墅服务站", price: 80, rating: null,
      complaintText: "", cancelActor: "", rescheduleActor: "", proposedDate: "2026-11-04 上午", previousStatus: "",
      events: [{title:"演示已就绪，可创建需求开始体验", actor:"系统", time:"刚刚"}],
      response: false, complaint: null
    });
    let state = initial();
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    // UI talks only to this adapter; replace its methods with HTTP calls when a backend exists.
    const MockApi = {
      async act(action, actor, detail = {}) {
        const transitions = {
          publish: ["draft","open"], respond: ["open","responded"], select: ["responded","selected"],
          proposeBooking: ["selected","booking_proposed"], confirmBooking: ["booking_proposed","booked"],
          start: ["booked","in_service"],
          submitCompletion: ["in_service","completion_pending"], complete: ["completion_pending","completed"],
          cancel: [["draft","open","responded","selected","booking_proposed"],"cancelled"],
          requestCancel: [["booked","in_service","completion_pending"],"cancel_requested"],
          approveCancel: ["cancel_requested","cancelled"], rejectCancel: ["cancel_requested","booked"],
          requestReschedule: ["booked","reschedule_requested"],
          acceptReschedule: ["reschedule_requested","booked"], rejectReschedule: ["reschedule_requested","booked"],
          complain: [["booked","in_service","completion_pending","completed"],"complaint"],
          proposeResolution: [["complaint","reopened"],"resolution_proposed"],
          confirmResolution: ["resolution_proposed","resolved"], reopenComplaint: ["resolution_proposed","reopened"],
          review: ["completed","completed"], decline: [["open","booking_proposed"],"open"]
        };
        const rule = transitions[action];
        if (!rule) throw new Error("未知操作");
        const [from, to] = rule;
        const allowed = Array.isArray(from) ? from.includes(state.status) : state.status === from;
        if (!allowed) throw new Error("当前状态不允许此操作");
        const target = typeof to === "string" ? to : from;
        state = {...state, ...detail, status:target};
        state.events.unshift({title: detail.event || ({
          publish:"需求已发布，等待服务方响应", respond:"服务方已响应需求",
          select:"家属已选择服务方", proposeBooking:"家属已确认服务单内容，等待服务方确认",
          confirmBooking:"服务方已确认预约，服务单成立",
          start:"服务方已标记开始服务", submitCompletion:"服务方提交服务完成",
          complete:"家属确认服务完成", cancel:"需求已在预约确认前取消",
          requestCancel:"一方提出取消申请，等待对方回应",
          approveCancel:"双方完成取消确认，预约已取消",
          rejectCancel:"对方未同意取消，预约恢复",
          requestReschedule:"一方提出改期申请，等待对方回应",
          acceptReschedule:"双方确认改期，预约时间已更新",
          rejectReschedule:"对方未同意改期，保留原预约时间",
          complain:"已提交投诉，等待平台处理", proposeResolution:"平台已提出处理结果，等待用户确认",
          confirmResolution:"用户确认处理结果，投诉关闭",
          reopenComplaint:"用户申请复核，投诉重新进入处理队列",
          review:"家属已提交服务评价", decline:"服务方暂不接单，需求继续开放"
        })[action], actor, time:new Date().toLocaleString("zh-CN",{hour:"2-digit",minute:"2-digit"})});
        render();
      }
    };

    function actionButton(text, action, kind="") {
      return `<button class="btn ${kind}" data-action="${action}">${text}</button>`;
    }
    function renderForm() {
      return `<div class="panel-head"><div><div class="eyebrow">家属端 · 新建需求</div><h2>发布照护服务需求</h2></div><span class="status warn">草稿</span></div>
        <div class="form">
          <div class="field"><label for="category">需要的服务 <small>必填</small></label><select id="category"><option>陪诊就医</option><option>上门助洁</option></select></div>
          <div class="field"><label for="region">服务区域 <small>必填</small></label><input id="region" value="杭州 · 拱墅区"></div>
          <div class="field"><label for="date">希望服务时间 <small>必填</small></label><input id="date" value="2026-11-03 上午"></div>
          <div class="field"><label for="mobility">行动情况 <small>选填</small></label><select id="mobility"><option>需搀扶</option><option>可自行行走</option><option>使用轮椅</option></select></div>
          <div class="field"><label for="note">服务说明 <small>选填，请勿填写病历或证件号</small></label><textarea id="note">协助完成挂号、候诊和院内路线指引</textarea></div>
          <div class="notice">模拟演示：提交后仅由虚拟服务方响应，不会向真实机构发送信息。</div>
          <div class="actions">${actionButton("提交演示需求","publish","primary")}</div>
        </div>`;
    }
    function render() {
      document.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === state.role)));
      const [label, stepIndex] = labels[state.status];
      const panel = $("#main");
      if (state.status === "draft" && state.role === "consumer") {
        panel.innerHTML = renderForm();
      } else {
        const roleLabel = {consumer:"家属端",provider:"服务方端",ops:"运营端"}[state.role];
        panel.innerHTML = `<div class="panel-head"><div><div class="eyebrow">${roleLabel} · ${esc(state.demandId)}</div><h2>${esc(state.category)}服务</h2></div><span class="status ${["cancelled","complaint"].includes(state.status)?"issue":state.status==="open"?"warn":""}">${label}</span></div>
          <div class="step-list">${steps.map((s,i)=>`<div class="step ${i<stepIndex?"done":""}"><i>${i<stepIndex?"✓":i+1}</i>${s}</div>`).join("")}</div>
          <div class="facts">
            <div class="fact"><span>服务区域</span><strong>${esc(state.region)}</strong></div>
            <div class="fact"><span>希望时间</span><strong>${esc(state.date)}</strong></div>
            <div class="fact"><span>行动情况</span><strong>${esc(state.mobility)}</strong></div>
            <div class="fact"><span>参考价格</span><strong>¥${state.price} 起 / 次</strong></div>
          </div>
          <div class="summary-row"><span>服务方</span><strong>${esc(state.provider)}</strong></div>
          <div class="summary-row"><span>服务说明</span><strong>${esc(state.note)}</strong></div>
          ${state.response ? `<div class="response"><div class="response-top"><strong>${esc(state.provider)}</strong><span class="status">资料已核验（演示）</span></div><p>陪同就医 · 服务区域已覆盖 · 可按需求时间响应<br>报价：¥${state.price} 起；超出服务范围的费用需事先确认。</p>${state.role==="consumer"&&state.status==="responded"?actionButton("选择此服务方","select","primary"):""}</div>`:""}
          <div class="notice">${state.status==="complaint"?"投诉已进入平台处理队列。此演示不会通知真实客服。":state.status==="cancelled"?"流程已关闭，取消原因与时间已记录在事件时间线。":"演示环境：所有操作均为模拟状态变更，不创建真实预约、不收取费用、不发送消息。"}</div>
          <div class="actions">${getActions()}</div>
          ${state.rating!==null?`<p class="footnote">评价已提交：${state.rating} 星。感谢你的反馈（演示数据）。</p>`:""}
          ${state.complaint?`<p class="footnote">投诉内容：${esc(state.complaintText)} · 当前状态：${state.status==="resolved"?"已处理":"处理中"}</p>`:""}`;
      }
      $("#timeline").innerHTML = state.events.map(e=>`<div class="event"><div class="event-mark"></div><div><strong>${esc(e.title)}</strong><time>${esc(e.actor)} · ${esc(e.time)}</time></div></div>`).join("");
    }
    function getActions() {
      if (state.role==="consumer") {
        if (state.status==="open") return `${actionButton("取消需求","cancel","danger")}<span class="quiet">等待服务方响应</span>`;
        if (state.status==="responded") return `${actionButton("取消需求","cancel","danger")}`;
        if (state.status==="selected") return `${actionButton("确认服务单内容","proposeBooking","primary")}${actionButton("取消需求","cancel","danger")}`;
        if (state.status==="booking_proposed") return `${actionButton("撤回服务单","cancel","danger")}`;
        if (state.status==="booked"||state.status==="in_service"||state.status==="completion_pending") return `${state.status==="completion_pending"?actionButton("确认服务完成","complete","primary"):""}${state.status==="booked"?actionButton("申请改期","requestReschedule",""):""}${actionButton("发起投诉","complain","danger")}${actionButton("申请取消","requestCancel","")}`;
        if (state.status==="cancel_requested"&&state.cancelActor==="服务方") return `${actionButton("同意取消","approveCancel","danger")}${actionButton("不同意，继续预约","rejectCancel")}`;
        if (state.status==="cancel_requested") return `<span class="quiet">取消申请已提交，等待另一方回应。</span>`;
        if (state.status==="reschedule_requested"&&state.rescheduleActor==="服务方") return `${actionButton("同意改期","acceptReschedule","primary")}${actionButton("保留原时间","rejectReschedule")}`;
        if (state.status==="reschedule_requested") return `<span class="quiet">改期申请已提交，等待服务方回应。拟改时间：${esc(state.proposedDate)}</span>`;
        if (state.status==="completed"&&!state.rating) return `${actionButton("提交 5 星评价","review","primary")}${actionButton("对服务发起投诉","complain","danger")}`;
        if (state.status==="complaint") return `<span class="quiet">运营处理中 · 可在时间线查看进展</span>`;
        if (state.status==="resolution_proposed") return `${actionButton("确认处理结果并关闭","confirmResolution","primary")}${actionButton("申请复核","reopenComplaint","danger")}`;
        if (state.status==="reopened") return `<span class="quiet">已申请复核，等待运营再次处理。</span>`;
        if (state.status==="resolved") return `<span class="quiet">流程已关闭。演示可重置后重新体验。</span>`;
        if (state.status==="cancelled") return `<span class="quiet">需求已关闭。</span>`;
      }
      if (state.role==="provider") {
        if (state.status==="open") return `${actionButton("响应需求并报价","respond","primary")}${actionButton("暂不接单","decline")}`;
        if (state.status==="booking_proposed") return `${actionButton("确认预约","confirmBooking","primary")}${actionButton("拒绝本次预约","decline","danger")}`;
        if (state.status==="booked") return `${actionButton("开始服务","start","primary")}${actionButton("申请改期","requestReschedule","")}${actionButton("申请取消","requestCancel","danger")}`;
        if (state.status==="in_service") return `${actionButton("提交服务完成","submitCompletion","primary")}${actionButton("发起异常上报","complain","danger")}`;
        if (state.status==="completion_pending") return `<span class="quiet">等待家属确认完成。</span>`;
        if (state.status==="cancel_requested"&&state.cancelActor==="家属") return `${actionButton("同意取消","approveCancel","danger")}${actionButton("不同意，继续预约","rejectCancel")}`;
        if (state.status==="cancel_requested") return `<span class="quiet">取消申请已提交，等待另一方回应。</span>`;
        if (state.status==="reschedule_requested"&&state.rescheduleActor==="家属") return `${actionButton("同意改期","acceptReschedule","primary")}${actionButton("保留原时间","rejectReschedule")}`;
        if (state.status==="reschedule_requested") return `<span class="quiet">改期申请已提交，等待家属回应。拟改时间：${esc(state.proposedDate)}</span>`;
        if (["completed","cancelled","complaint","resolution_proposed","resolved","reopened"].includes(state.status)) return `<span class="quiet">当前没有待服务方处理的动作。</span>`;
        if (state.status==="responded") return `<span class="quiet">已响应，等待家属选择服务方。</span>`;
      }
      if (state.role==="ops") {
        if (state.status==="complaint"||state.status==="reopened") return `${actionButton("提出处理结果，等待用户确认","proposeResolution","primary")}`;
        if (state.status==="cancel_requested") return `${actionButton("运营介入：确认取消并关闭","approveCancel","danger")}`;
        if (state.status==="reschedule_requested") return `${actionButton("运营介入：确认改期","acceptReschedule","primary")}${actionButton("保留原时间","rejectReschedule")}`;
        return `<span class="quiet">服务方审核、投诉处置等运营操作可在对应状态下模拟；当前无待处理工单。</span>`;
      }
      return `<span class="quiet">请先从家属端创建需求，或重置演示。</span>`;
    }
    function value(id) { return document.getElementById(id)?.value || ""; }
    document.addEventListener("click", async (event) => {
      const role = event.target.closest("[data-role]");
      if (role) { state.role=role.dataset.role; render(); return; }
      if (event.target.id==="reset") { state=initial(); render(); return; }
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action=button.dataset.action;
      const actor={consumer:"家属",provider:"服务方",ops:"平台运营"}[state.role];
      if (action==="publish") {
        state.category=value("category"); state.region=value("region"); state.date=value("date"); state.mobility=value("mobility"); state.note=value("note");
      }
      if (action==="respond") {
        await MockApi.act(action,actor,{response:true,price:80,event:"服务方响应需求并提交演示报价"});
        return;
      }
      if (action==="complain") {
        $("#modal-root").innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="complaint-title"><h2 id="complaint-title">提交演示投诉</h2><p>请选择问题说明。仅更新本地演示状态，不会发送给真实机构或客服。</p><div class="field"><label for="complaintText">投诉说明</label><textarea id="complaintText" placeholder="例如：服务迟到、内容与约定不符"></textarea></div><div class="actions"><button class="btn" id="close-modal">返回</button><button class="btn primary" id="submit-complaint">提交投诉</button></div></section></div>`;
        $("#close-modal").onclick=()=>$("#modal-root").innerHTML="";
        $("#submit-complaint").onclick=async()=>{state.complaint=true;state.complaintText=value("complaintText")||"演示投诉：服务与约定不符";$("#modal-root").innerHTML="";await MockApi.act("complain",actor,{event:"投诉已提交，等待平台受理"});};
        return;
      }
      if (action==="review") await MockApi.act(action,actor,{rating:5,event:"家属提交 5 星评价，订单关闭"});
      else if (action==="decline") await MockApi.act(action,actor,{event:"服务方暂不接单；家属可重新匹配或关闭需求"});
      else if (action==="cancel") await MockApi.act(action,actor,{event:"已取消未确认的演示需求"});
      else if (action==="requestCancel") {
        state.cancelActor=actor; state.previousStatus=state.status;
        await MockApi.act(action,actor,{event:`${actor}提出取消申请，等待另一方回应`});
      }
      else if (action==="requestReschedule") {
        state.rescheduleActor=actor; state.proposedDate="2026-11-04 上午";
        await MockApi.act(action,actor,{event:`${actor}申请改期至${state.proposedDate}`});
      }
      else if (action==="acceptReschedule") {
        state.date=state.proposedDate;
        await MockApi.act(action,actor,{event:`${actor}同意改期，预约时间更新为${state.proposedDate}`});
      }
      else if (action==="rejectReschedule") await MockApi.act(action,actor,{event:`${actor}未同意改期，保留原时间${state.date}`});
      else if (action==="approveCancel") await MockApi.act(action,actor,{event:`${actor}同意取消，预约已关闭`});
      else if (action==="rejectCancel") {
        const restored=state.previousStatus==="in_service"?"in_service":"booked";
        await MockApi.act(action,actor,{event:`${actor}不同意取消，预约恢复至${restored==="in_service"?"服务中":"已确认"}`});
        state={...state,status:restored}; render();
      }
      else await MockApi.act(action,actor);
    });
    render();
  </script>
</body>
</html>
